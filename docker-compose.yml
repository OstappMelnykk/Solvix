# Керується через ./scripts/solvix (demo / up / down). Руками теж можна:
#   docker compose up -d --build --wait
name: solvix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solvix}
      POSTGRES_USER: ${POSTGRES_USER:-solvix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # 5434, а не 5432 - щоб не конфліктувати з іншим локальним postgres.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solvix} -d ${POSTGRES_DB:-solvix}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Solvix.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-solvix};Username=${POSTGRES_USER:-solvix};Password=${POSTGRES_PASSWORD:-changeme}
      ModelLibrary__DirectoryPath: /app/model-library
      # Звітування панелі керування (./scripts/solvix panel); без панелі API просто мовчить.
      SOLVIX_LAUNCHER: docker
      Control__Url: ${CONTROL_URL:-http://host.docker.internal:5200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model_library_data:/app/model-library
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./solvix-web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      - api
    healthcheck:
      # Іде через nginx до API, тож зелений стан = працює весь ланцюжок.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

# Явні імена, щоб дані не губились при перейменуванні compose-проєкту.
volumes:
  postgres_data:
    name: solvix_v1_postgres_data
  model_library_data:
    name: solvix_v1_model_library_data
