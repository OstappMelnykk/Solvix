ans-serif" font-size="38" fill="#F3F1EA">висячий вузол</text><circle cx="1130" cy="340" r="13" fill="#4ADE80" stroke="#fff" stroke-width="3"/><text x="1162" y="352" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="38" fill="#F3F1EA">вузол, спільний для обох</text><path d="M1118 420 L1142 420 L1130 440 Z" fill="#FF5C5C" fill-opacity="0.65" stroke="#FF8A8A" stroke-width="2.5" stroke-dasharray="6 5"/><text x="1162" y="438" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="38" fill="#F3F1EA">розрив у розрахунку</text><text x="860" y="735" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" fill="#B5C2CE">Без шаблону шов розкривається, із шаблоном лишається цілим</text></svg>