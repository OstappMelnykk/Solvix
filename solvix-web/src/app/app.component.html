<div class="app-layout" [style.width.px]="appWidth" [style.height.px]="appHeight">
  <app-session-tabs class="app-layout__session-tabs" />

  <div class="app-layout__body-row">
    <app-toolbar-panel class="app-layout__toolbar-panel" />

    <as-split class="app-layout__body" unit="percent" [gutterSize]="9.5" (dragEnd)="onDragEnd($event)">
      <as-split-area size="*">
        <app-render-window class="app-layout__render-window" />
      </as-split-area>
      <as-split-area [size]="split.settingsWidth()" [minSize]="split.settingsMinWidth" [maxSize]="split.settingsMaxWidth">
        <app-settings-panel class="app-layout__settings-panel" />
      </as-split-area>
    </as-split>
  </div>

  <app-footer class="app-layout__footer" />

  <router-outlet />
</div>
