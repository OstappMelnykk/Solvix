<div class="zone-painting__header">
  <span class="zone-painting__step">Крок 1 з 2 · Вокселі</span>
  <span class="zone-painting__title">Нова зона</span>
  <button type="button" class="zone-painting__back" (click)="close()">Закрити</button>
</div>

<div class="zone-painting__body">
  <div class="zone-painting__grid">
    <div class="zone-painting__panel" *ngFor="let i of panelIndices" [class.zone-painting__panel--result]="isResultPanel(i)">
      <canvas #canvas (pointerdown)="onPointerDown(i, $event)" (pointermove)="onPointerMove(i, $event)" (pointerup)="onPointerUp(i)"></canvas>
      <canvas *ngIf="!isResultPanel(i)" #overlay class="zone-painting__overlay"></canvas>
      <span class="zone-painting__label">{{ axisLabel(i) }}</span>
      <button *ngIf="!isResultPanel(i)" type="button" class="zone-painting__flip" title="Змінити сторону цієї осі" (click)="flipSign(i)">⇄</button>
    </div>
  </div>

  <div class="zone-painting__sidebar">
    <!-- Status - always visible at the top, answers "where am I" at a
         glance before anything else in the panel. -->
    <div class="zone-painting__status">
      <div class="zone-painting__status-row">
        <span>{{ coverageText() }}</span>
        <span>{{ coveragePercent() }}%</span>
      </div>
      <div class="zone-painting__progress-bar">
        <div class="zone-painting__progress-fill" [style.width.%]="coveragePercent()"></div>
      </div>
    </div>

    <div class="zone-painting__group">
      <div class="zone-painting__group-label">Малювання</div>
      <button type="button" class="zone-painting__finish-zone" [style.border-color]="nextZoneColor()" (click)="finishZone()">
        Завершити зону
      </button>
    </div>

    <div class="zone-painting__group">
      <div class="zone-painting__group-label">Відображення</div>
      <label class="zone-painting__opacity">
        Прозорість вокселів
        <input type="range" min="0" max="100" [value]="voxelOpacityPercent()" (input)="onVoxelOpacityChange($event)" />
      </label>
      <label class="zone-painting__opacity">
        Прозорість STL
        <input type="range" min="0" max="100" [value]="referenceOpacityPercent()" (input)="onReferenceOpacityChange($event)" />
      </label>
      <label class="zone-painting__opacity" *ngIf="coveragePercent() > 0">
        Прозорість зон на 3D результаті
        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          [value]="zoneOverlayOpacity()"
          (input)="setZoneOverlayOpacityFromInput($any($event.target).value)"
        />
      </label>
    </div>
  </div>
</div>
