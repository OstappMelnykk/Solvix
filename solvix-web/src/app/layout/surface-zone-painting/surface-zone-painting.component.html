<div class="surface-zone-painting__header">
  <button type="button" class="surface-zone-painting__prev-step" (click)="goToStep1()">← Крок 1: Вокселі</button>
  <span class="surface-zone-painting__step">Крок 2 з 2 · STL-поверхня</span>
  <span class="surface-zone-painting__title">Розмітка зон на STL-поверхні</span>
  <button type="button" class="surface-zone-painting__back" (click)="close()">Закрити</button>
</div>

<div class="surface-zone-painting__body">
  <div class="surface-zone-painting__grid">
    <div
      class="surface-zone-painting__panel"
      *ngFor="let i of panelIndices"
      [class.surface-zone-painting__panel--result]="isResultPanel(i)"
    >
      <canvas #canvas (pointerdown)="onPointerDown(i, $event)" (pointermove)="onPointerMove(i, $event)" (pointerup)="onPointerUp(i)"></canvas>
      <canvas *ngIf="!isResultPanel(i)" #overlay class="surface-zone-painting__overlay"></canvas>
      <span class="surface-zone-painting__label">{{ axisLabel(i) }}</span>
      <button *ngIf="!isResultPanel(i)" type="button" class="surface-zone-painting__flip" title="Змінити сторону цієї осі" (click)="flipSign(i)">⇄</button>
    </div>
  </div>

  <div class="surface-zone-painting__sidebar">
    <!-- Status - always visible at the top, same idiom as step 1. -->
    <div class="surface-zone-painting__status">
      <div class="surface-zone-painting__status-row">
        <span>{{ coverageText() }}</span>
        <span>{{ coveragePercent() }}%</span>
      </div>
      <div class="surface-zone-painting__progress-bar">
        <div class="surface-zone-painting__progress-fill" [style.width.%]="coveragePercent()"></div>
      </div>
    </div>

    <!-- The ONE thing the user asked to be unmissable: which zone is
         currently active. A single big banner, not a list to scan. -->
    <div class="surface-zone-painting__current-zone" [style.border-color]="currentZoneColor()">
      <button
        type="button"
        class="surface-zone-painting__zone-nav"
        [disabled]="!canGoToPreviousZone()"
        title="Повернутись до попередньої зони"
        (click)="goToPreviousZone()"
      >
        ←
      </button>
      <span class="surface-zone-painting__current-zone-swatch" [style.background]="currentZoneColor()"></span>
      <span class="surface-zone-painting__current-zone-label">{{ currentZoneLabel() }}</span>
    </div>

    <div class="surface-zone-painting__group">
      <label class="surface-zone-painting__subdivisions" title="На скільки дрібно ділити кожен воксель для вибору зон на STL-поверхні">
        Деталізація сітки (÷N)
        <input type="number" [attr.min]="minShellSubdivisions" step="1" [value]="shellSubdivisions()" (input)="onShellSubdivisionsChange($event)" />
      </label>
    </div>

    <div class="surface-zone-painting__group">
      <div class="surface-zone-painting__zone-picker-label">Інструмент</div>
      <div class="surface-zone-painting__mode-row">
        <button
          type="button"
          class="surface-zone-painting__mode-option"
          [class.surface-zone-painting__mode-option--active]="brushMode() === 'brush'"
          (click)="setBrushMode('brush')"
        >
          Кисть
        </button>
        <button
          type="button"
          class="surface-zone-painting__mode-option"
          [class.surface-zone-painting__mode-option--active]="brushMode() === 'eraser'"
          (click)="setBrushMode('eraser')"
        >
          Гумка
        </button>
      </div>

      <div class="surface-zone-painting__zone-picker-label">Розмір</div>
      <button
        type="button"
        class="surface-zone-painting__brush-option"
        *ngFor="let size of brushSizes"
        [class.surface-zone-painting__brush-option--active]="size === brushRadius()"
        (click)="setBrushRadius(size)"
      >
        <span class="surface-zone-painting__brush-dot" [style.width.px]="dotSizeFor(size)" [style.height.px]="dotSizeFor(size)"></span>
      </button>

      <button type="button" class="surface-zone-painting__finish" (click)="finishSelection()">Завершити виділення</button>
    </div>

    <!-- Pushed to the bottom and visually the loudest thing in the panel -
         per explicit user request that Save shouldn't be lost among the
         brush tools/subdivisions input. -->
    <div class="surface-zone-painting__primary-action">
      <p class="surface-zone-painting__saved" *ngIf="isSaved()">Розмітку STL збережено.</p>
      <ng-container *ngIf="!isSaved()">
        <button type="button" class="surface-zone-painting__primary-button" [disabled]="!canRunPrimaryAction()" (click)="runPrimaryAction()">
          {{ primaryActionLabel() }}
        </button>
        <p class="surface-zone-painting__save-hint" *ngIf="saveDisabledReason() as reason">{{ reason }}</p>
      </ng-container>
      <button type="button" class="surface-zone-painting__reset-link" (click)="resetSelections()">Скинути всю розмітку STL</button>
    </div>
  </div>
</div>
