<div class="hint">Піднесіть вершину до STL: вона прилипне й рухатиметься лише по поверхні. <b>Alt</b> — відірвати.</div>
<label class="row" title="Вимкніть, щоб вершини рухались вільно й ніколи не прилипали до STL">
  <span>Прилипання до STL увімкнено</span>
  <input type="checkbox" [checked]="snapEnabled()" (change)="onSnapEnabled($event)" />
</label>
<label class="row" title="На якій відстані від STL вершина прилипає, у відсотках від розміру STL. Менше — менш чутливо.">
  <span>Чутливість, % розміру</span>
  <input type="number" min="0.1" max="5" step="0.1" [value]="snapPercent()" (change)="onSnapPercent($event)" />
</label>
<div class="selected">Прикріплено вершин: <b>{{ attachedCount() }}</b></div>
<button class="tool" type="button" [disabled]="attachedCount() === 0" (click)="detachAllNodes()">Відкріпити всі</button>
