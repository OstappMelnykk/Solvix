<div
  *ngFor="let world of worlds; let i = index"
  class="world"
  [class.world--active]="activeWorldIndex() === i"
  (click)="selectWorld(i)"
>
  <span class="dot"></span>
  <span class="name">{{ world.name }}</span>
  <span class="badge">{{ activeWorldIndex() === i ? 'write' : 'read-only' }}</span>
</div>
