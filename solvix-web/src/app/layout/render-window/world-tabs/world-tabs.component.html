<div
  *ngFor="let world of worlds; let i = index"
  class="world"
  [class.world--active]="state.activeWorldIndex() === i"
  (click)="state.selectWorld(i)"
>
  <span class="dot"></span>
  <span class="name">{{ world.name }}</span>
  <span class="badge">{{ state.activeWorldIndex() === i ? 'write' : 'read-only' }}</span>
</div>
