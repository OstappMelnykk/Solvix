<app-world-tabs class="render-window__world-tabs" />

<div class="render-window__canvases">
  <app-world-canvas
    *ngFor="let world of worlds; let i = index"
    [sessionId]="sessions.activeSessionId()"
    [worldIndex]="i"
    [representation]="getRepresentation(i)"
    [importedReference]="getImportedReference(i)"
    [active]="activeWorldIndex() === i"
    [hidden]="activeWorldIndex() !== i"
  />
</div>
