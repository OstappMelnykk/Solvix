<canvas #canvas></canvas>
<button
  class="reference-visibility-toggle"
  type="button"
  [hidden]="!isIdealWorldCanvas()"
  [title]="isImportedReferenceVisible() ? 'Приховати STL-референс' : 'Показати STL-референс'"
  (click)="toggleImportedReferenceVisible()"
>
  {{ isImportedReferenceVisible() ? 'Приховати STL' : 'Показати STL' }}
</button>
<button class="camera-mode-toggle" type="button" (click)="toggleCameraMode()">
  {{ getCameraMode() === 'perspective' ? 'Перспектива' : 'Ортографія' }}
</button>
<button class="camera-reset-button" type="button" title="Скинути камеру до початкового положення" (click)="resetCamera()">
  Скинути камеру
</button>
<button
  class="grid-toggle"
  type="button"
  [title]="isGridVisible() ? 'Сховати сітку підлоги' : 'Показати сітку підлоги'"
  (click)="toggleGridVisible()"
>
  {{ isGridVisible() ? 'Сховати сітку' : 'Показати сітку' }}
</button>
<button
  class="six-view-toggle"
  type="button"
  [disabled]="!hasModel()"
  title="Переглянути об'єкт з 6 сторін (ортографічні проекції)"
  (click)="openSixView()"
>
  6 сторін
</button>
<div class="voxel-rule-notice" [hidden]="!getDeletionViolationMessage()">
  {{ getDeletionViolationMessage() }}
</div>
