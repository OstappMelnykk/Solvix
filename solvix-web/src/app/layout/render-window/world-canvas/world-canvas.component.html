<!-- trackBy on canvasGeneration - see its own comment in the .ts file. This
     canvas is otherwise never conditionally destroyed; the *ngFor exists
     solely so a permanently-lost WebGL context (browser never fires
     webglcontextrestored - not guaranteed by spec) can be recovered by
     forcing Angular to hand this ONE World a genuinely fresh <canvas>
     element, instead of staying a dead/broken-image canvas until a full
     page reload. -->
<canvas #canvas *ngFor="let g of canvasKeys(); trackBy: trackGeneration"></canvas>

<div class="canvas-toolbar">
  <div class="canvas-toolbar__group">
    <div class="canvas-toolbar__label">Вид</div>
    <button class="tool-button" type="button" (click)="toggleCameraMode()">
      {{ getCameraMode() === 'perspective' ? 'Перспектива' : 'Ортографія' }}
    </button>
    <button class="tool-button" type="button" title="Скинути камеру до початкового положення" (click)="resetCamera()">
      Скинути камеру
    </button>
    <button
      class="tool-button"
      type="button"
      [title]="isGridVisible() ? 'Сховати сітку підлоги' : 'Показати сітку підлоги'"
      (click)="toggleGridVisible()"
    >
      {{ isGridVisible() ? 'Сховати сітку' : 'Показати сітку' }}
    </button>
    <button
      class="tool-button"
      type="button"
      [disabled]="!hasModel()"
      title="Переглянути об'єкт з 6 сторін (ортографічні проекції)"
      (click)="openSixView()"
    >
      6 сторін
    </button>
  </div>

  <div class="canvas-toolbar__group" [hidden]="!showsBuildToggle()">
    <div class="canvas-toolbar__label">Будування</div>
    <button
      class="tool-button"
      [class.tool-button--on]="isBuildOn()"
      type="button"
      title="Мишею: права кнопка — додати куб (на грань під курсором; на землі — перший куб у клітинку); ліва — видалити куб під курсором. Скасувати можна Ctrl+Z."
      (click)="toggleBuild()"
    >
      {{ isBuildOn() ? 'Будувати мишею: увімкнено' : 'Будувати мишею: вимкнено' }}
    </button>
    <div class="canvas-toolbar__hint" [hidden]="!isBuildOn()">ПКМ — додати · ЛКМ — видалити</div>
  </div>

  <div class="canvas-toolbar__group" [hidden]="!canDetachSelected()">
    <div class="canvas-toolbar__label">Вершина прилипла до STL</div>
    <button class="tool-button" type="button" title="Відлипити вибрану вершину від STL: далі вона рухається вільно. Те саме — утримувати Alt під час тягнення." (click)="detachSelected()">
      Відлипити від STL
    </button>
    <div class="canvas-toolbar__hint">Alt під час тягнення теж відриває</div>
  </div>

  <div class="canvas-toolbar__group" [hidden]="!showsReferenceToggle()">
    <div class="canvas-toolbar__label">Модель</div>
    <button
      class="tool-button"
      type="button"
      [title]="isImportedReferenceVisible() ? 'Приховати STL-референс' : 'Показати STL-референс'"
      (click)="toggleImportedReferenceVisible()"
    >
      {{ isImportedReferenceVisible() ? 'Приховати STL' : 'Показати STL' }}
    </button>
  </div>
</div>
