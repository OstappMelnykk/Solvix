<canvas #canvas></canvas>

<div class="canvas-toolbar">
  <div class="canvas-toolbar__group">
    <div class="canvas-toolbar__label">Вид</div>
    <button class="tool-button" type="button" (click)="toggleCameraMode()">
      {{ getCameraMode() === 'perspective' ? 'Перспектива' : 'Ортографія' }}
    </button>
    <button class="tool-button" type="button" title="Скинути камеру до початкового положення" (click)="resetCamera()">
      Скинути камеру
    </button>
    <button
      class="tool-button"
      type="button"
      [title]="isGridVisible() ? 'Сховати сітку підлоги' : 'Показати сітку підлоги'"
      (click)="toggleGridVisible()"
    >
      {{ isGridVisible() ? 'Сховати сітку' : 'Показати сітку' }}
    </button>
    <button
      class="tool-button"
      type="button"
      [disabled]="!hasModel()"
      title="Переглянути об'єкт з 6 сторін (ортографічні проекції)"
      (click)="openSixView()"
    >
      6 сторін
    </button>
  </div>

  <div class="canvas-toolbar__group" [hidden]="!isIdealWorldCanvas()">
    <div class="canvas-toolbar__label">Модель</div>
    <button
      class="tool-button"
      type="button"
      [title]="isImportedReferenceVisible() ? 'Приховати STL-референс' : 'Показати STL-референс'"
      (click)="toggleImportedReferenceVisible()"
    >
      {{ isImportedReferenceVisible() ? 'Приховати STL' : 'Показати STL' }}
    </button>
  </div>

  <div class="canvas-toolbar__group" [hidden]="!isIdealWorldCanvas()">
    <div class="canvas-toolbar__label">Зони</div>
    <button
      class="tool-button"
      type="button"
      [disabled]="!hasVoxelization()"
      title="Розмітити зони на вокселізованій сітці (docs/local-refinement/PROBLEMS.md, Проблема 2, Варіант D)"
      (click)="openZonePainting()"
    >
      Розмітка зон
    </button>
    <button
      class="tool-button"
      type="button"
      [disabled]="!hasAnyZones()"
      [title]="hasAnyZones() ? 'Показати/сховати кольори зон на моделі' : 'Доступно, коли хоч одна зона вже створена'"
      (click)="toggleZonesOverlay()"
    >
      {{ isZonesOverlayVisible() ? 'Сховати зони' : 'Показати зони' }}
    </button>
    <label class="tool-slider" [hidden]="!isZonesOverlayVisible()">
      Прозорість зон
      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        [value]="zoneOverlayOpacity()"
        (input)="setZoneOverlayOpacityFromInput($any($event.target).value)"
      />
    </label>
    <button
      class="tool-button"
      type="button"
      [disabled]="!hasAnySurfaceZoning()"
      [title]="hasAnySurfaceZoning() ? 'Показати/сховати розфарбовану за зонами STL-поверхню (ховає вокселі)' : 'Доступно, коли хоч одна зона вже має розмітку на STL-поверхні'"
      (click)="toggleSurfaceZonesOverlay()"
    >
      {{ isSurfaceZonesOverlayVisible() ? 'Сховати зони на STL' : 'Показати зони на STL' }}
    </button>
  </div>
</div>

<div class="voxel-rule-notice" [hidden]="!getDeletionViolationMessage()">
  {{ getDeletionViolationMessage() }}
</div>
