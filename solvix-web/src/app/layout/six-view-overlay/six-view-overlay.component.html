<div class="six-view-overlay__header">
  <span class="six-view-overlay__title">Перегляд з 6 сторін</span>
  <span class="six-view-overlay__header-hint" *ngIf="headerHint()">{{ headerHint() }}</span>
  <div class="six-view-overlay__opacity-controls" *ngIf="showModelOpacityControls()">
    <label class="six-view-overlay__opacity">
      Прозорість STL
      <input type="range" min="0" max="100" [value]="referenceOpacityPercent()" (input)="onReferenceOpacityChange($event)" />
    </label>
  </div>
  <button type="button" class="six-view-overlay__back" (click)="close()">Назад</button>
</div>
<!-- *ngIf, not just the host's own [hidden] - dispose() (teardownRenderers,
     see its own comment) never actually frees the underlying WebGL context,
     kept that way deliberately to avoid a past reused-canvas regression. A
     canvas left in the DOM forever, merely CSS-hidden, keeps its context
     permanently reserved from the moment it's first created, for the rest
     of the page's life - stacked against every other lazy WebGL tool this
     app has, that cumulative total can exceed the browser's context budget
     within a single long session even though nothing is ever
     simultaneously open.

     Safe to key this on the SAME isHidden() that also gates rendering
     : isHidden() here only flips on an explicit
     "6 сторін"/"Назад" click (SixViewOverlayService.open/close), never
     toggled by some OTHER tool merely covering this one, so
     destroying+recreating these 6 contexts is a rare, deliberate action,
     not something that would happen many times per session. The camera-
     continuity fix in ensureRenderersReady (this component's own comment)
     is what makes a genuinely fresh canvas+context on each reopen look
     correct instead of snapping to orbit the world origin. -->
<div class="six-view-overlay__grid" [class.six-view-overlay__grid--has-main]="mainPanel !== null" *ngIf="!isHidden()">
  <div
    class="six-view-overlay__panel"
    [class.six-view-overlay__panel--main]="isMain(i)"
    *ngFor="let i of panelIndices; trackBy: trackPanel"
    (dblclick)="toggleMain(i)"
  >
    <canvas #canvas></canvas>
    <span class="six-view-overlay__label">{{ panelLabel(i) }}</span>
    <button type="button" class="six-view-overlay__recenter" title="Відцентрувати цю панель" (click)="recenter(i)">⟲</button>
    <button
      type="button"
      class="six-view-overlay__maximize"
      [title]="isMain(i) ? 'Повернути сітку з 6 видів' : 'Зробити основним (збільшити); подвійний клік по виду — те саме'"
      (click)="toggleMain(i)"
    >
      {{ isMain(i) ? '⤡' : '⤢' }}
    </button>
    <div class="six-view-overlay__drag-text" *ngIf="isMain(i) && dragText">{{ dragText }}</div>
    <div class="six-view-overlay__hint" *ngIf="isMain(i) && canDragNodes() && !dragText">
      Тягніть точку (вузол) — вона рухається в площині цього виду. Shift — по одній осі.
    </div>
  </div>
</div>
