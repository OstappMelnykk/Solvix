name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Solvix_v1.sln

      - name: Build
        run: dotnet build Solvix_v1.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Solvix_v1.sln --no-build --configuration Release

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solvix-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: solvix-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build